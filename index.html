    <!-- ТЕПЕРЬ ПОДКЛЮЧАЕМ ИЗ СКАЧАННОЙ ПАПКИ NODE_MODULES -->
    <script type="module">
        import { initializeApp } from "./node_modules/@firebase/app/dist/esm/index.js";
        import { getAuth, signInWithPopup, GithubAuthProvider, GoogleAuthProvider, signOut, onAuthStateChanged } from "./node_modules/@firebase/auth/dist/esm/index.js";
        import { getDatabase, ref, push, onValue } from "./node_modules/@firebase/database/dist/esm/index.js";

        // КОНФИГУРАЦИЯ FIREBASE (Укажите ваши реальные ключи!)
        const firebaseConfig = {
            apiKey: "ВАШ_API_KEY",
            authDomain: "ВАШ_PROJECT_://firebaseapp.com",
            databaseURL: "https://ВАШ_PROJECT_://firebaseio.com", 
            projectId: "ВАШ_PROJECT_ID",
            storageBucket: "ВАШ_PROJECT_://appspot.com",
            messagingSenderId: "ВАШ_ОТПРАВИТЕЛЬ",
            appId: "ВАШ_APP_ID"
        };

        // Инициализация сервисов Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Провайдеры
        const githubProvider = new GithubAuthProvider();
        const googleProvider = new GoogleAuthProvider();

        // DOM элементы
        const unauthBlock = document.getElementById('unauth-block');
        const authBlock = document.getElementById('auth-block');
        const dbBlock = document.getElementById('db-block');
        const userName = document.getElementById('user-name');
        const userEmail = document.getElementById('user-email');
        const dataList = document.getElementById('data-list');
        const todoForm = document.getElementById('todo-form');
        const todoInput = document.getElementById('todo-input');

        // Вход через GitHub
        document.getElementById('btn-github').addEventListener('click', () => {
            signInWithPopup(auth, githubProvider).catch(err => alert("Ошибка GitHub: " + err.message));
        });

        // Вход через Google
        document.getElementById('btn-google').addEventListener('click', () => {
            signInWithPopup(auth, googleProvider).catch(err => alert("Ошибка Google: " + err.message));
        });

        // Выход из аккаунта
        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth).catch(err => alert("Ошибка при выходе: " + err.message));
        });

        // Отслеживание состояния авторизации
        onAuthStateChanged(auth, (user) => {
            if (user) {
                userName.textContent = user.displayName || "Пользователь";
                userEmail.textContent = user.email || "";
                
                unauthBlock.classList.add('hidden');
                authBlock.classList.remove('hidden');
                dbBlock.classList.remove('hidden');
                
                loadDatabaseData(); 
            } else {
                unauthBlock.classList.remove('hidden');
                authBlock.classList.add('hidden');
                dbBlock.classList.add('hidden');
                dataList.innerHTML = '';
            }
        });

        // Отправка данных в Realtime Database
        todoForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = todoInput.value.trim();
            if (!text) return;

            const messagesRef = ref(db, 'messages');
            
            push(messagesRef, {
                text: text,
                author: auth.currentUser.displayName || auth.currentUser.email || "Аноним",
                timestamp: Date.now()
            }).then(() => {
                todoInput.value = ''; 
            }).catch(err => alert("Ошибка записи в БД: " + err.message));
        });

        // Чтение данных из Realtime Database в реальном времени
        function loadDatabaseData() {
            const messagesRef = ref(db, 'messages');
            
            onValue(messagesRef, (snapshot) => {
                dataList.innerHTML = ''; 
                
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    Object.keys(data).forEach(key => {
                        const item = data[key];
                        const li = document.createElement('li');
                        li.innerHTML = `<strong>${item.author}:</strong> ${item.text}`;
                        dataList.appendChild(li);
                    });
                } else {
                    dataList.innerHTML = '<li>База данных пока пуста. Добавьте первую запись!</li>';
                }
            }, (error) => {
                console.error("Ошибка чтения БД:", error);
            });
        }
    </script>
